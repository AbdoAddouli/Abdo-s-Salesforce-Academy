name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate committed curricula.js
        run: node -e "const s=require('fs').readFileSync('docs/assets/curricula.js','utf8');new (require('vm').Script)(s,'docs/assets/curricula.js');const c=new (require('vm').createContext())();new (require('vm').Script)(s).runInContext(c);const d=c.window.ABDO_DATA;const n=Object.keys(d).length;if(n!==8){console.error('expected 8 academies, found ',n);process.exit(1)}console.log('OK: curricula.js aggregates '+n+' academies');

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4