<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abdo's Salesforce Academy</title>
  <meta name="description" content="All eight Salesforce certification and concept roadmaps in one interactive studio: Admin, Business Analyst, CPQ & Revenue Cloud, Data Cloud, Developer I & II, Headless & MCP, Sales Cloud and Service Cloud — with quizzes, gated exercises, progress tracking, GitHub repos and live sites." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link rel="stylesheet" href="assets/style.css?v=1" />
  <script>
    (function() {
      var t;
      try { t = localStorage.getItem('abdo-academy-theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">

    <aside class="sidebar" aria-label="Academy navigation">
      <!-- filled by app.js -->
    </aside>

    <div class="content">

      <header class="topbar">
        <i class="readbar" id="readBar" aria-hidden="true"></i>
        <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="sidebarNav">&#9776;</button>
        <a class="brand" href="#/">
          <span class="logo">&#127891;</span>
          <span class="brand-text">
            <b>Abdo&rsquo;s Salesforce Academy</b><small id="brandSub">8 academies</small>
          </span>
        </a>
        <div class="tb-search">
          <input id="topSearch" type="search" placeholder="Search every academy&hellip;  (press /)" autocomplete="off" />
          <span class="kbd">/</span>
        </div>
        <div class="tb-meter" title="Progress">
          <div class="tb-bar"><i id="topBar"></i></div>
          <span id="topPct" class="tb-pct">0%</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">&#127769;</button>
      </header>

      <main id="view"></main>

      <footer class="footer">
        <a href="https://github.com/AbdoAddouli" target="_blank" rel="noopener">AbdoAddouli on GitHub</a>
        <span>&middot;</span>
        <span>8 Salesforce academy roadmaps &middot; API 68.0</span>
        <span>&middot;</span>
        <span>Progress is saved in your browser</span>
      </footer>

    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="assets/curricula.js?v=1"></script>
  <script src="assets/app.js?v=1"></script>
</body>
</html>
